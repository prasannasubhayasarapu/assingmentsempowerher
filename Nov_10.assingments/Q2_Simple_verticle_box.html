<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        .card-container{
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            width: 500px;
            background-color:rgb(162, 173, 214);
            border-radius: 16px;
            margin: auto;
            font-size: 20px;
            padding: 20px;
            text-align: center;
            font-family: 'roboto', sans-serif;
            font-style: italic;
            color: rgb(21, 52, 168);
        }
        .card-container .card{
            width: 80%;
            height: 230px;
            background-color:white;
            margin-top: 50px;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            color: gray;
padding: 10px;
            font-size: 28px;
            font-style: normal;

        }
        .card{
    padding: 20px;
        }
       .card h1{
        color: black;
    margin-bottom: 20px;
       }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SimpleVerticalBox</title>
</head>
<body>
    <div class="card-container">
<h1>Highest &<br>Average CTC</h1>
<div class="card">
<p>Expected Increase in <br> Salary Potential</p>
<h1>60%</h1>
</div>
<div class="card">
<p>Average CTC</p>
<h1>₹6.1 LPA</h1>
</div>
<div class="card">
<p>Highest CTC
</p>
<h1>₹36 LPA</h1>
</div>

    </div>
</body>
</html>
